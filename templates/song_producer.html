{% extends 'base.html' %}
{% block content %}
<h1>Producers per Song</h1>
<table>
  <tr>
    <th>
      <b>Title</b>
    </th>
    <th>
      <b>Producers</b>
    </th>
  </tr>

  {% for song in songs %}
  <tr>
    <td>
      {{ song.title }}
    </td>
    <td>
      {{ song.producer_name }}
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
