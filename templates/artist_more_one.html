{% extends 'base.html' %}
{% block content %}
<h1>All the artists that produced songs with Taylor Swift and the number of songs they produced</h1>
<table>
  <tr>
    <th>
      <b>artist id</b>
    </th>
    <th>
      <b>Name</b>
    </th>
    <th>
      <b>Number of songs</b>
    </th>
  </tr>

  {% for song in songs %}
  <tr>
    <td>
      <a href="/pessoa/{{ song.id }}">{{song.id }}</a>
    </td>
    <td>
      {{ song.name }}
    </td>
    <td>
      {{ song.num }}
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
