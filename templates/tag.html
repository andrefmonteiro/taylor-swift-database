{% extends 'base.html' %}
{% block content %}
<h1>Pessoa</h1>
<table>
  <tr>
    <th>
      <b>id</b>
    </th>
    <th>
      <b>name</b>
    </th>
  </tr>

  {% for tag in tags %}
  <tr>
    <td>
      <a href="/tag/{{ tag.id }}">{{tag.id }}</a>
    </td>
    <td>
      {{ tag.nome }}
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
