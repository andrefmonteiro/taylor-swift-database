{% extends 'base.html' %}
{% block content %}
<h1>Pessoa</h1>
<table>
  <tr>
    <th>
      <b>id</b>
    </th>
    <th>
      <b>name</b>
    </th>
  </tr>

  {% for person in persons %}
  <tr>
    <td>
      <a href="/pessoa/{{ person.id }}">{{person.id }}</a>
    </td>
    <td>
      {{ person.nome }}
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
